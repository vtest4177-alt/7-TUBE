name: Build 7-Tube APK

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build 7-Tube APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build 7-Tube Prerelease Debug APK
        run: ./gradlew assemblePrereleaseDebug --no-daemon

      - name: Upload 7-Tube APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7-tube-apk
          path: app/build/outputs/apk/prerelease/debug/*.apk
          if-no-files-found: error
