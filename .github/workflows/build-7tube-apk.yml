name: Build 7-Tube APK

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build 7-Tube APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build 7-Tube Release APK
        run: ./gradlew assembleStableRelease --no-daemon --stacktrace

      - name: Upload 7-Tube APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: 7-tube-apk
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error

      - name: Publish Direct GitHub Release APK Link
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: 7tube-latest
          name: 7-Tube Latest APK (TG7 ERROR)
          prerelease: false
          files: app/build/outputs/apk/stable/release/*.apk
